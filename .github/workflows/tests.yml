name: Testes do Admin Web

on:
  push:
    branches: ['**']
  pull_request:

# O repositório do admin tem os arquivos na RAIZ (não numa pasta admin/) — por isso nenhum passo
# usa working-directory (versões antigas deste arquivo usavam e nunca rodaram no GitHub).

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Typecheck + build de produção
        run: npm run build
