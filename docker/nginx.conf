# SPA com react-router-dom via BrowserRouter (ver src/main.tsx) — qualquer rota que não bate
# num arquivo real cai pro index.html, o roteamento fica por conta do React. Sem isso, um
# refresh em /empresas/123 (por exemplo) daria 404 direto no Nginx.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite gera nome de arquivo com hash de conteúdo (ver dist/assets/) — pode cachear "pra
    # sempre" sem risco de servir versão velha: um deploy novo gera hashes novos.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html é o único arquivo que referencia os assets com hash da vez — nunca cachear,
    # senão um deploy novo continua servindo os assets antigos (que podem nem existir mais).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
